name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      version_override:
        required: false
        type: string
        default: ""
      upstream_version_override:
        required: false
        type: string
        default: ""

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Prepare image and version metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          UPSTREAM_VERSION_OVERRIDE: ${{ inputs.upstream_version_override }}
        run: |
          python3 .github/scripts/prepare_build.py \
            --config "${{ inputs.app }}/config.yaml" \
            --owner "${REPOSITORY_OWNER}" \
            --version "${VERSION_OVERRIDE}" \
            --upstream-version-file "${{ inputs.app }}/upstream-version.txt" \
            --upstream-version "${UPSTREAM_VERSION_OVERRIDE}"

      - name: Read App information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./${{ inputs.app }}

      - name: Normalize App information
        id: normalize
        shell: bash
        env:
          IMAGE_JSON: ${{ steps.info.outputs.image }}
          VERSION_JSON: ${{ steps.info.outputs.version }}
          NAME_JSON: ${{ steps.info.outputs.name }}
          DESCRIPTION_JSON: ${{ steps.info.outputs.description }}
          URL_JSON: ${{ steps.info.outputs.url }}
        run: |
          set -Eeuo pipefail

          image=$(jq -er 'select(type == "string" and length > 0)' <<< "${IMAGE_JSON}")
          version=$(jq -er 'select(type == "string" and length > 0)' <<< "${VERSION_JSON}")
          name=$(jq -er 'select(type == "string" and length > 0)' <<< "${NAME_JSON}")
          description=$(jq -er 'select(type == "string" and length > 0)' <<< "${DESCRIPTION_JSON}")
          url=$(jq -er 'if . == null then "" else select(type == "string") end' <<< "${URL_JSON}")

          if [[ "${image}" != */* ]]; then
            echo "::error::Invalid App image reference: ${image}"
            exit 1
          fi

          {
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=${version}"
            echo "name=${name}"
            echo "description=${description}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Prepare image and version metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          UPSTREAM_VERSION_OVERRIDE: ${{ inputs.upstream_version_override }}
        run: |
          python3 .github/scripts/prepare_build.py \
            --config "${{ inputs.app }}/config.yaml" \
            --owner "${REPOSITORY_OWNER}" \
            --version "${VERSION_OVERRIDE}" \
            --upstream-version-file "${{ inputs.app }}/upstream-version.txt" \
            --upstream-version "${UPSTREAM_VERSION_OVERRIDE}"

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ inputs.app }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
