name: Supply Drop BBS
description: Mesh-first bulletin board server for MeshCore and Meshtastic networks
version: "0.12.0"
slug: supply_drop_bbs
url: https://github.com/Mesh-America/supply-drop-bbs
image: ghcr.io/bjorkan/supply-drop-bbs-ha-app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
backup: cold
uart: true
usb: true
udev: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Supply Drop BBS web administration
webui: http://[HOST]:[PORT:8080]
watchdog: http://[HOST]:[PORT:8080]/health
map:
  - type: addon_config
    read_only: false
options:
  config_mode: home_assistant
  bbs_name: Supply Drop BBS
  welcome_message: Welcome to {name}.
  timezone: UTC
  require_verify: true
  guest_room: ""
  log_level: INFO
  backup_enabled: true
  backup_interval_hours: 6
  meshcore_enabled: false
  meshcore_connection_type: serial
  meshcore_serial_port: /dev/ttyACM0
  meshcore_baud_rate: 115200
  meshcore_tcp_address: 127.0.0.1:5000
  meshcore_command_prefix: ""
  meshcore_path_bytes: 3
  meshcore_flood_after_send: true
  meshcore_reply_max_attempts: 1
  meshtastic_enabled: false
  meshtastic_connection_type: serial
  meshtastic_serial_port: /dev/ttyACM0
  meshtastic_baud_rate: 115200
  meshtastic_tcp_address: 127.0.0.1:4403
  meshtastic_command_prefix: ""
  meshtastic_long_name: Supply Drop BBS
  meshtastic_short_name: SDB
  web_enabled: true
  web_external_origin: ""
  web_cookie_secure: false
  prometheus_enabled: false
schema:
  config_mode: list(home_assistant|file)
  bbs_name: str(1,80)
  welcome_message: str(0,500)
  timezone: str(1,64)
  require_verify: bool
  guest_room: str(0,80)
  log_level: list(TRACE|DEBUG|INFO|WARN|ERROR)
  backup_enabled: bool
  backup_interval_hours: int(1,168)
  meshcore_enabled: bool
  meshcore_connection_type: list(serial|tcp|hat)
  meshcore_serial_port: str(1,255)
  meshcore_baud_rate: int(1200,4000000)
  meshcore_tcp_address: str(3,255)
  meshcore_command_prefix: str(0,1)
  meshcore_path_bytes: int(2,3)
  meshcore_flood_after_send: bool
  meshcore_reply_max_attempts: int(1,10)
  meshtastic_enabled: bool
  meshtastic_connection_type: list(serial|tcp|hat)
  meshtastic_serial_port: str(1,255)
  meshtastic_baud_rate: int(1200,4000000)
  meshtastic_tcp_address: str(3,255)
  meshtastic_command_prefix: str(0,1)
  meshtastic_long_name: str(0,39)
  meshtastic_short_name: str(0,4)
  web_enabled: bool
  web_external_origin: str(0,255)
  web_cookie_secure: bool
  prometheus_enabled: bool
